name: Build and Push Docker Image

# A pipeline dispara automaticamente ao fazer push para main ou develop
on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  # Transforma 'seu-usuario/nome-do-repo' no caminho do pacote
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar o código fonte
        uses: actions/checkout@v4

      - name: Configurar o Docker Buildx (Compilador do Docker)
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar Tags automaticamente com base na Branch
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Cria a tag com o nome da branch (ex: :main ou :develop)
            type=ref,event=branch
            # Se for na main, também cria a tag :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Compilar e Enviar a Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}