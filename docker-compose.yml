services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    mem_limit: 512m      
    memswap_limit: 512m 
    cpus: "0.50"        

volumes:
  postgres_data: